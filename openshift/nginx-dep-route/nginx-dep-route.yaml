apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: ak-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        # Remove runAsUser: 1000 — let OpenShift assign from the namespace's UID range
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:latest
        ports:
        - containerPort: 8080                     # <-- unprivileged runs on 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: ak-test
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080    # <-- updated to match container port
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx-route
  namespace: ak-test
spec:
  to:
    kind: Service
    name: nginx-service
  port:
    targetPort: 8080      # <-- updated to match
  tls:
    termination: edge
