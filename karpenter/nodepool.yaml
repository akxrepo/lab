# ---------------- NodePool ----------------
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        environment: lab
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7i-flex.large", "m7i-flex.large", "t3.micro", "t3.small"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
# ---------------- EC2NodeClass ----------------
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "arn:aws:iam::934639816556:role/AmazonEKSMGDNodeRole"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-mgd-cluster-1-33"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-mgd-cluster-1-33"
