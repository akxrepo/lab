apiVersion: v1
kind: Service
metadata:
  name: pod-info-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: pod-info-svc
spec:
  ports:
  - name: http
    port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: {{ .Values.service.targetPort }}
  selector:
    app: pod-info
  type: ClusterIP
