apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: multus-stateful-static
  namespace: default
spec:
  serviceName: multus-static-svc
  replicas: 2
  selector:
    matchLabels:
      app: multus-static-pod
  template:
    metadata:
      labels:
        app: multus-static-pod
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "enx1-net-static",
              "interface": "eth1"
            }
          ]
    spec:
      containers:
      - name: test
        image: alpine:latest
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache iproute2 || true

          ORDINAL="${HOSTNAME##*-}"
          IP="10.0.26.$((60 + ORDINAL))"

          ip link set eth1 up
          ip addr add "${IP}/24" dev eth1
          ip route add 10.0.26.0/24 dev eth1 || true

          sleep infinity
