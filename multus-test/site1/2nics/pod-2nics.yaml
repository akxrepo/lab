apiVersion: v1
kind: Pod
metadata:
  name: multus-test-2nics
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "enx1-net-static",
          "interface": "eth1"
        },
        {
          "name": "enx2-net-dynamic",
          "interface": "eth2"
        }
      ]
spec:
  containers:
  - name: test
    image: alpine
    command:
    - /bin/sh
    - -c
    - |
      # Configure static IP on eth1
      ip addr add 10.0.26.101/24 dev eth1
      ip link set eth1 up

      echo "===== Interfaces ====="
      ip addr

      echo "===== Routes ====="
      ip route

      sleep infinity
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
