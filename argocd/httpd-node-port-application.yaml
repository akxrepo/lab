apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpd-node-port
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akxrepo/lab.git
    targetRevision: HEAD
    path: k8s/httpd_node_port
  destination:
    server: https://kubernetes.default.svc
    namespace: httpd
