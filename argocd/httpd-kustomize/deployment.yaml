apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: httpd-kustomize
  name: httpd-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-kustomize
  template:
    metadata:
      labels:
        app: httpd-kustomize
    spec:
      containers:
      - image: httpd
        name: httpd-kustomize
